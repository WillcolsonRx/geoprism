name: Report a bug
description: Help reproduce a GEOPrism issue.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: GEO accession and platform
      placeholder: GSE accession / GPL platform
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the settings you selected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: R environment and error output
      description: Paste sessionInfo() and relevant console output; remove private information.
      render: text
