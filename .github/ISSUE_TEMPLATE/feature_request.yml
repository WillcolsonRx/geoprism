name: Suggest an improvement
description: Suggest a feature, platform mapping, or documentation improvement.
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include a relevant public dataset or workflow when possible.
    validations:
      required: true
